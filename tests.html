<script>
(function() {
  'use strict';

  /* ──── Helpers ──── */
  function eq(a, b) { return a === b; }
  function ne(a, b) { return a !== b; }
  function ok(v) { return !!v; }
  function has(s, sub) { return String(s).indexOf(sub) !== -1; }
  function approx(a, b, tol) { return Math.abs(a - b) < (tol || 0.01); }

  /* ──── Reset état global entre chaque test ──── */
  function resetData() {
    try {

      savedArticles = [];
      savedDocuments = [];
      familles = [];
      savedChantiers = [];
      suppliers = [];
      frais = [];
      purchaseInvoices = [];

      hrWorkEntries = [];
      hrTransactions = [];
      currentInvoiceItems = [];

      dismissedAlerts = [];

      purchaseModalLines = [];
      editingPurchaseInvoiceId = null;
      currentSupplierPaymentInvoiceId = null;

      if (typeof __bonsRouteFilterDestination !== 'undefined') __bonsRouteFilterDestination = 'all';
      if (typeof __bonsRoutePage !== 'undefined') __bonsRoutePage = 0;
    } catch (e) {}

    if (g) g.value = String(retGar == null ? 0 : retGar);

  /* ════════════════════════════════════════════════════
     LISTE DES TESTS
     ════════════════════════════════════════════════════ */

    TESTS.push({ cat: cat, name: name, fn: fn });

  /* ═══════════════════════════════════════════════════

  });

  add('Storage', 'STORAGE_KEYS.documents', function() { return has(STORAGE_KEYS.documents, 'documents'); });
  add('Storage', 'STORAGE_KEYS 25+ clés', function() { return Object.keys(STORAGE_KEYS).length >= 25; });
  add('Storage', 'genererNumero facture', function() { resetData(); return has(genererNumero('facture'), 'FAC-'); });
  add('Storage', 'genererNumero devis', function() { resetData(); return has(genererNumero('devis'), 'DEV-'); });

  add('Alertes', 'computeChantierMarge vide', function() { resetData(); return eq(computeChantierMarge('ch1').marge, 0); });

  add('Alertes', 'computeFournisseurAlerts vide', function() { resetData(); return eq(computeFournisseurAlerts().length, 0); });
  add('Alertes', 'computeClientAlerts vide', function() { resetData(); return eq(computeClientAlerts().length, 0); });

     CATÉGORIE 6 — MÉTIER (15)
     ═══════════════════════════════════════════════════ */

    add('BTP Facture', 'retenueGarantie 5% sur HT 1000', function() {
    resetData(); setupInvoiceInputs(19, 1, 0, 0, 5);
    currentInvoiceItems = [{ quantite: 10, prix: 100 }];

  /* ─── Bloc CamScanner ─── */
  add('Vérif réelle', 'Otsu: sépare deux modes [30, 220]', function () {
    if (typeof _scanOtsuThreshold !== 'function') return false;
    /* Distribution bimodale réaliste (gris foncé 30 / gris clair 220).
       Le seuil doit tomber entre les deux modes pour bien séparer. */
    var gray = new Uint8Array(100);
    for (var i = 0; i < 50; i++) gray[i] = 30;
    for (var j = 50; j < 100; j++) gray[j] = 220;
    var t = _scanOtsuThreshold(gray);
    return t >= 30 && t <= 220;
  });

  add('Vérif réelle', 'Otsu: cas extrême [0, 255] ne donne pas 0 (clamp v6.10.4)', function () {
    if (typeof _scanOtsuThreshold !== 'function') return false;
    var gray = new Uint8Array(100);
    for (var i = 0; i < 50; i++) gray[i] = 0;
    for (var j = 50; j < 100; j++) gray[j] = 255;
    var t = _scanOtsuThreshold(gray);
    /* Grâce au clamp [1, 254], t ne peut pas être 0 ni 255 → binarisation OK */
    return t >= 1 && t <= 254;
  });

  add('Vérif réelle', 'Binarize: fast produit noir/blanc uniquement', function () {
    if (typeof _scanBinarizeCanvas !== 'function') return false;
    var canvas = document.createElement('canvas');
    canvas.width = 10; canvas.height = 10;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#888'; ctx.fillRect(0, 0, 10, 10);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 5, 5);
    _scanBinarizeCanvas(canvas, 'fast');
    var data = ctx.getImageData(0, 0, 10, 10).data;
    for (var k = 0; k < data.length; k += 4) {
      if (data[k] !== 0 && data[k] !== 255) return false;
    }
    return true;
  });

  add('Vérif réelle', 'Perspective: warp produit un canvas non nul', function () {
    if (typeof _scanApplyPerspectiveWarp !== 'function') return false;
    var src = document.createElement('canvas');
    src.width = 100; src.height = 100;
    var ctx = src.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 100, 100);
    ctx.fillStyle = '#000'; ctx.fillRect(20, 20, 60, 60);
    var corners = [
      { x: 20, y: 20 }, { x: 80, y: 20 },
      { x: 80, y: 80 }, { x: 20, y: 80 }
    ];
    var result = _scanApplyPerspectiveWarp(src, corners);
    return result !== null && result.width > 0 && result.height > 0;
  });

  /* ─── Bloc Backup / Trash ─── */
  add('Vérif réelle', 'Backup: contient bonsRoute', function () {
    if (typeof buildCompleteBackupData !== 'function') return false;
    var oldBr = bonsRoute;
    try {
      bonsRoute = [{ id: '__test_br', numero: 'BR-2026-TEST' }];
      var b = buildCompleteBackupData();
      return b && Array.isArray(b.bonsRoute) && b.bonsRoute.length === 1;
    } finally {
      bonsRoute = oldBr;
    }
  });

  add('Vérif réelle', 'Backup: contient rne (v6.9.4+)', function () {
    if (typeof buildCompleteBackupData !== 'function') return false;
    var b = buildCompleteBackupData();
    return b && b.config && typeof b.config.rne === 'string';
  });

  add('Vérif réelle', 'Trash: bonsRoute listé dans corbeille', function () {
    if (typeof renderTrash !== 'function') return false;
    var el = document.getElementById('trashList');
    if (!el) return true;
    var oldTrash = trash;
    try {
      trash = {
        clients: [], articles: [], documents: [],
        bonsRoute: [{
          item: { id: '__test_br', numero: 'BR-2026-TEST', type: 'sortie' },
          deletedAt: new Date().toISOString()
        }]
      };
      renderTrash();
      var html = el.innerHTML;
      return html.indexOf('Bons Route') >= 0 || html.indexOf('BR-2026-TEST') >= 0;
    } finally {
      trash = oldTrash;
    }
  });

  /* ─── Bloc Cleanup orphelins ─── */
  add('Vérif réelle', 'Cleanup: sig_default protégé', async function () {
    if (typeof _cleanOrphanBlobs !== 'function' || !__TEST_IDB_AVAILABLE) return true;
    try {
      var blob = await _dataURLToBlob(__TEST_PNG_DATAURL);
      await _idbBlobsPut('sig_default', blob, 'image/png');
      var orphanId = '__orphan_' + Date.now();
      await _idbBlobsPut(orphanId, new Blob(['x']), 'text/plain');
      await _cleanOrphanBlobs();
      var sigRow = await _idbBlobsGet('sig_default');
      var orphanRow = await _idbBlobsGet(orphanId);
      return sigRow !== null && orphanRow === null;
    } catch (e) {
      try { await _idbBlobsDelete('sig_default'); } catch (e2) {}
      return false;
    }
  });

  /* ─── Bloc PDF avec images ─── */
  add('Vérif réelle', 'PDF: cachet inséré comme <img>', function () {
    if (typeof _buildInvoiceHTML !== 'function') return false;
    var doc = {
      id: 'd', numero: 'FAC-TEST', type: 'facture',
      date: '2026-11-10', clientId: null,
      items: [{ designation: 'X', quantite: 1, prix: 100 }],
      totals: { totalHT: 100, tva: 19, tvaRate: 19, timbre: 1, totalTTC: 120, total: 120, netAPayer: 120 },
      paiements: []
    };
    var html = _buildInvoiceHTML(doc, {
      cachetDataUrl: __TEST_PNG_DATAURL,
      signatureDataUrl: null
    });
    return html.indexOf('<img src="data:image/png') >= 0;
  });

  add('Vérif réelle', 'PDF: sans images garde placeholder texte', function () {
    if (typeof _buildInvoiceHTML !== 'function') return false;
    var doc = {
      id: 'd', numero: 'FAC-TEST', type: 'facture',
      date: '2026-11-10', clientId: null,
      items: [{ designation: 'X', quantite: 1, prix: 100 }],
      totals: { totalHT: 100, tva: 19, tvaRate: 19, timbre: 1, totalTTC: 120, total: 120, netAPayer: 120 },
      paiements: []
    };
    var html = _buildInvoiceHTML(doc, {});
    return html.indexOf('Cachet & Signature VOLTCORE') >= 0 &&
           html.indexOf('Signature client') >= 0;
  });

  /* ════════════════════════════════════════════════════
     RUNNER
     ════════════════════════════════════════════════════ */

  var results = [];
  var totalPass = 0, totalFail = 0;
  var currentCat = '';
  var currentCatPass = 0, currentCatTotal = 0;

  function updateSummary() {
    var s = document.getElementById('summary');
    var total = results.length;
    var expected = TESTS.length;
    if (total < expected) {
      s.innerHTML = '⏳ Exécution… <strong>' + total + '</strong> / ' + expected +
        ' · ✅ ' + totalPass + ' · ❌ ' + totalFail;
    } else {
      var isAllOk = totalFail === 0;
      s.innerHTML = '<div class="big ' + (isAllOk ? 'ok-text' : 'ko-text') + '">' +
        (isAllOk ? '✅ TOUS LES TESTS PASSENT (' + total + ')' : '❌ ' + totalFail + ' ÉCHEC(S) SUR ' + total) +
        '</div><div style="margin-top:8px">Total : <strong>' + total + '</strong>' +
        ' · ✅ <span class="ok-text"><strong>' + totalPass + '</strong></span>' +
        ' · ❌ <span class="ko-text"><strong>' + totalFail + '</strong></span></div>';
    }
  }

  /* v6.8.2 — Sanitize un nom de catégorie pour en faire un ID HTML
     valide. Remplace tout caractère non [a-zA-Z0-9_] par '_'.
     Sans ça, "computeLineTotal (LOT 5)" produit l'ID
     'table_computeLineTotal_(LOT_5)' qui throw en querySelector
     (parenthèses = sélecteur CSS invalide). */
  function _safeCatId(s) {
    return String(s || '').replace(/[^a-zA-Z0-9_]/g, '_');
  }

  /* v6.9.1 — Construit le texte complet du rapport (format lisible,
     copiable dans un mail/WhatsApp/issue GitHub). */
  function _buildTestReportText() {
    var lines = [];
    lines.push('═══════════════════════════════════════════════════════════════');
    lines.push('VOLTCORE — Rapport de tests');
    lines.push('═══════════════════════════════════════════════════════════════');
    lines.push('');
    var now = new Date();
    var dateStr = now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0') + ' ' +
      String(now.getHours()).padStart(2, '0') + ':' +
      String(now.getMinutes()).padStart(2, '0') + ':' +
      String(now.getSeconds()).padStart(2, '0');
    lines.push('Date         : ' + dateStr);
    lines.push('Total        : ' + results.length);
    lines.push('Réussis      : ' + totalPass + ' ✅');
    lines.push('Échoués      : ' + totalFail + ' ❌');
    lines.push('Statut       : ' + (totalFail === 0 ? 'SUCCÈS TOTAL ✅' : 'ÉCHEC ❌'));
    lines.push('');

    /* Grouper par catégorie en préservant l'ordre d'apparition */
    var catOrder = [];
    var byCat = {};
    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      if (!byCat[r.cat]) {
        byCat[r.cat] = [];
        catOrder.push(r.cat);
      }
      byCat[r.cat].push(r);
    }

    for (var c = 0; c < catOrder.length; c++) {
      var cat = catOrder[c];
      var list = byCat[cat];
      var pass = 0, fail = 0;
      for (var k = 0; k < list.length; k++) {
        if (list[k].ok) pass++; else fail++;
      }
      lines.push('─── ' + cat + ' (' + pass + '/' + list.length + ') ───');
      for (var j = 0; j < list.length; j++) {
        var r2 = list[j];
        var mark = r2.ok ? '✅' : '❌';
        lines.push('  ' + r2.idx + '. ' + mark + ' ' + r2.name);
        if (!r2.ok && r2.error) {
          lines.push('       Erreur : ' + r2.error);
        }
      }
      lines.push('');
    }

    lines.push('═══════════════════════════════════════════════════════════════');
    lines.push('FIN DU RAPPORT');
    lines.push('═══════════════════════════════════════════════════════════════');
    return lines.join('\n');
  }

  /* Copie le rapport complet dans le presse-papiers.
     Utilise copyToClipboard de 03-utils.js (async + fallback).
     Feedback visuel : bouton change de texte pendant 2s. */
  window.copyTestReport = async function () {
    var btn = document.getElementById('btnCopyReport');
    var origText = '📋 Copier le rapport';
    if (btn) {
      btn.disabled = true;
      btn.textContent = '⏳ Copie…';
    }

    var text = _buildTestReportText();
    var ok = false;

    if (typeof copyToClipboard === 'function') {
      try {
        ok = await copyToClipboard(text);
      } catch (e) {
        console.warn('copyToClipboard :', e);
        ok = false;
      }
    } else {
      /* Fallback direct si 03-utils.js absent */
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) {
        ok = false;
      }
    }

    if (btn) {
      if (ok) {
        btn.textContent = '✅ Rapport copié !';
        btn.style.background = '#2e7d32';
        setTimeout(function () {
          btn.textContent = origText;
          btn.disabled = false;
        }, 2000);
      } else {
        btn.textContent = '❌ Échec de copie';
        btn.style.background = '#c0392b';
        setTimeout(function () {
          btn.textContent = origText;
          btn.style.background = '#2e7d32';
          btn.disabled = false;
        }, 2500);
      }
    }
  };

  function appendHeader(cat) {
    var main = document.getElementById('testResults');
    var div = document.createElement('div');
    div.className = 'cat-title';
    if (cat.indexOf('LOT 5') >= 0) div.className += ' lot5';
    else if (cat.indexOf('BTP') >= 0) div.className += ' btp';
    else if (cat.indexOf('S3') >= 0) div.className += ' s3';
    var safeId = _safeCatId(cat);
    div.id = 'cat_' + safeId;
    div.innerHTML = '<span>' + cat + '</span><span id="catcount_' + safeId + '">0/0</span>';
    main.appendChild(div);

    var table = document.createElement('table');
    table.id = 'table_' + safeId;
    table.innerHTML = '<thead><tr><th style="width:40px">#</th><th>Test</th><th style="width:60px">Statut</th><th>Détail</th></tr></thead><tbody></tbody>';
    main.appendChild(table);
    currentCat = cat;
    currentCatPass = 0;
    currentCatTotal = 0;
  }

  function appendResult(test, idx, okStatus, error) {
    var catKey = _safeCatId(test.cat);
    var table = document.getElementById('table_' + catKey);
    if (!table) return;
    var tbody = table.querySelector('tbody');
    if (!tbody) return;
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="num">' + idx + '</td>' +
      '<td>' + test.name.replace(/</g, '&lt;') + '</td>' +
      '<td class="status ' + (okStatus ? 'pass' : 'fail') + '">' + (okStatus ? '✅ PASS' : '❌ FAIL') + '</td>' +
      '<td class="error">' + (error || '') + '</td>';
    tbody.appendChild(tr);

    currentCatTotal++;
    if (okStatus) currentCatPass++;
    var cc = document.getElementById('catcount_' + catKey);
    if (cc) cc.textContent = currentCatPass + '/' + currentCatTotal;
  }

  async function runAllTests() {
    for (var i = 0; i < TESTS.length; i++) {
      var test = TESTS[i];
      if (test.cat !== currentCat) {
        appendHeader(test.cat);
      }

      var result = { ok: false, error: '' };
      try {
        var ret = test.fn();
        if (ret && typeof ret.then === 'function') {
          ret = await ret;
        }
        result.ok = !!ret;
      } catch (e) {
        result.ok = false;
        result.error = e && e.message ? e.message : String(e);
      }

      /* v6.9.1 — enrichi pour permettre la reconstruction du rapport texte */
      results.push({
        ok: result.ok,
        error: result.error,
        name: test.name,
        cat: test.cat,
        idx: i + 1
      });
      if (result.ok) totalPass++; else totalFail++;
      appendResult(test, i + 1, result.ok, result.error);
      updateSummary();
    }
    updateSummary();

    /* v6.9.1 — active le bouton « Copier le rapport » une fois terminé */
    var copyBtn = document.getElementById('btnCopyReport');
    if (copyBtn) copyBtn.disabled = false;
  }

  /* Démarre après un petit délai (laisse les scripts terminer) */
  setTimeout(runAllTests, 500);
  console.log('✅ tests.html chargé — v6.7 (155 tests — LOT 5 + Session #3)');
})();
</script>
