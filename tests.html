<script>
(function () {
  'use strict';

  var T_START = Date.now();
  var VC = window.VOLTCORE;
  if (!VC) {
    document.body.innerHTML = '<h1 style="color:red">❌ VOLTCORE non chargé</h1>';
    return;
  }

  var S = VC.Store, U = VC.Utils, Doc = VC.Doc, IDB = VC.IDB;
  var TEST_PREFIX = '__test_';
  var TEST_TIMEOUT_MS = 5000;
  var BAIL_ON_FAIL = false;

  /* ═══════════ HELPERS ═══════════ */

  function uid(p) {
    return TEST_PREFIX + p + '_' + Date.now().toString(36) +
      Math.random().toString(36).slice(2, 6);
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function simulateF5() {
    S.loadAll();
    if (VC.Migrate && typeof VC.Migrate.upgradeIfNeeded === 'function') {
      VC.Migrate.upgradeIfNeeded();
    }
  }

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () {
        reject(new Error('Timeout ' + ms + 'ms'));
      }, ms);
      promise.then(function (v) { clearTimeout(timer); resolve(v); },
                   function (e) { clearTimeout(timer); reject(e); });
    });
  }

  /* Cleanup ciblé par collection */
  function cleanupCollection(name) {
    var spec = S.getSpec(name);
    if (!spec || spec.type !== 'array') return;
    var arr = S.getAll(name);
    var clean = arr.filter(function (it) {
      if (!it) return false;
      var id = String(it.id || '');
      var nom = String(it.nom || it.designation || '');
      /* FIX : nettoie aussi les items créés par saveFromForm (id 'cli_xxx'
         mais nom contenant TEST_PREFIX) */
      return id.indexOf(TEST_PREFIX) !== 0 &&
             nom.indexOf(TEST_PREFIX) === -1;
    });
    if (clean.length !== arr.length) S.replaceAll(name, clean);
  }

  function cleanupTrash() {
    var trash = S.getTrash();
    var keys = Object.keys(trash);
    for (var i = 0; i < keys.length; i++) {
      var entries = trash[keys[i]];
      if (!Array.isArray(entries)) continue;
      trash[keys[i]] = entries.filter(function (e) {
        return !(e && e.item && String(e.item.id || '').indexOf(TEST_PREFIX) === 0);
      });
    }
    try { localStorage.setItem('voltcore_trash', JSON.stringify(trash)); } catch (e) {}
  }

  function cleanupQuarantine() {
    try {
      var toRemove = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('voltcore_quarantine_') === 0) toRemove.push(k);
      }
      for (var j = 0; j < toRemove.length; j++) localStorage.removeItem(toRemove[j]);
    } catch (e) {}
  }

  function cleanupAll() {
    var cols = S.listRegistered();
    for (var i = 0; i < cols.length; i++) cleanupCollection(cols[i]);
    cleanupTrash();
    cleanupQuarantine();
  }

  /* ═══════════ TESTS STORAGE ═══════════ */

  var TESTS = [];
  var BAIL = false;

  function add(cat, name, fn) {
    TESTS.push({ cat: cat, name: name, fn: fn, skip: false });
  }

  function skip(cat, name, reason) {
    TESTS.push({
      cat: cat, name: name, skip: true, skipReason: reason,
      fn: function () { return true; }
    });
  }

  /* ═══════════════════════════════════════════════════════════
     CAT A — CORE + UTILS (15)
     ═══════════════════════════════════════════════════════════ */
  add('A. Core', 'VERSION existe', function () { return VC.VERSION === '7.0.7'; });
  add('A. Core', 'device détecté', function () { return VC.device && typeof VC.device.mobile === 'boolean'; });
  add('A. Core', 'log.info existe', function () { return typeof VC.logInfo === 'function'; });

  add('A. Utils', 'escapeHtml <script>', function () { return U.escapeHtml('<script>') === '&lt;script&gt;'; });
  add('A. Utils', 'escapeAttr apostrophe', function () { return U.escapeAttr("'") === '&#39;'; });
  add('A. Utils', 'formatMoney 1234.5', function () { return U.formatMoney(1234.5).indexOf('1 234') >= 0; });
  add('A. Utils', 'formatMoney NaN → 0', function () { return U.formatMoney(NaN).indexOf('0') >= 0; });
  add('A. Utils', 'parseNumber FR "1 234,5"', function () { return U.parseNumber('1 234,5') === 1234.5; });
  add('A. Utils', 'parseNumber US "1,234.56"', function () { return U.parseNumber('1,234.56') === 1234.56; });
  add('A. Utils', 'parseNumber "abc" → 0', function () { return U.parseNumber('abc') === 0; });
  add('A. Utils', 'computeLineTotal 2×100', function () { return U.computeLineTotal({ qte: 2, pu: 100 }) === 200; });
  add('A. Utils', 'computeLineTotal remise 5%', function () { return U.computeLineTotal({ qte: 2, pu: 100, remisePct: 5 }) === 190; });
  add('A. Utils', 'computeLineTotal qte négative (avoir)', function () { return U.computeLineTotal({ qte: -1, pu: 100 }) === -100; });
  add('A. Utils', 'todayISO format YYYY-MM-DD', function () { return U.todayISO().length === 10; });
  add('A. Utils', 'formatDate 2026-10-20', function () { return U.formatDate('2026-10-20') === '20/10/2026'; });
  add('A. Utils', 'addDaysISO +5j', function () { return U.addDaysISO('2026-01-10', 5) === '2026-01-15'; });
  add('A. Utils', 'numberToFrenchWords 21', function () { return U.numberToFrenchWords(21).indexOf('vingt et un') >= 0; });
  add('A. Utils', 'formatBytes 1024', function () { return U.formatBytes(1024).indexOf('Ko') >= 0; });

  /* ═══════════════════════════════════════════════════════════
     CAT B — STORE FONDAMENTAL (18)
     ═══════════════════════════════════════════════════════════ */
  add('B. Store', 'register existe', function () { return typeof S.register === 'function'; });
  add('B. Store', 'listRegistered non vide', function () { return S.listRegistered().length >= 10; });
  add('B. Store', 'getAll vide = []', function () { return Array.isArray(S.getAll('clients')); });
  add('B. Store', 'save crée item', function () {
    var id = uid('c');
    return S.save('clients', { id: id, nom: 'T1' }) !== null;
  });
  add('B. Store', 'save → getById', function () {
    var id = uid('c');
    S.save('clients', { id: id, nom: 'T2' });
    return S.getById('clients', id) !== null;
  });
  add('B. Store', 'save → F5 → présent', function () {
    var id = uid('c');
    S.save('clients', { id: id, nom: 'T3' });
    simulateF5();
    return S.getById('clients', id) !== null;
  });
  add('B. Store', 'save préserve TOUS les champs', function () {
    var id = uid('c');
    S.save('clients', { id: id, nom: 'T4', telephone: '123', email: 'a@b.c' });
    var got = S.getById('clients', id);
    return got && got.telephone === '123' && got.email === 'a@b.c';
  });
  add('B. Store', 'save même id = upsert', function () {
    var id = uid('c');
    S.save('clients', { id: id, nom: 'V1' });
    S.save('clients', { id: id, nom: 'V2' });
    var got = S.getById('clients', id);
    return got && got.nom === 'V2';
  });
  add('B. Store', 'save sans nom requis → null', function () {
    return S.save('clients', { id: uid('c'), nom: '' }) === null;
  });
  add('B. Store', 'delete retire de getAll', function () {
    var id = uid('c');
    S.save('clients', { id: id, nom: 'DEL' });
    S.delete('clients', id);
    return S.getById('clients', id) === null;
  });
  add('B. Store', 'replaceAll remplace tout', function () {
    S.replaceAll('clients', [{ id: uid('c'), nom: 'R1' }]);
    return S.getAll('clients').length === 1;
  });
  add('B. Store', 'setObject / getObject', function () {
    S.setObject('config', { rib: 'RIB_TEST' });
    return S.getObject('config').rib === 'RIB_TEST';
  });
  add('B. Store', 'incrementCompteur', function () {
    S.resetCompteurs();
    S.incrementCompteur('facture');
    return S.getCompteurs()['facture_' + new Date().getFullYear()] === 1;
  });
  add('B. Store', 'genererNumero format FAC-YYYY-NNNN', function () {
    var n = S.genererNumero('facture');
    return /^FAC-\d{4}-\d{4}$/.test(n);
  });
  add('B. Store', 'subscribe notifié sur save', function () {
    var count = 0;
    var fn = function () { count++; };
    S.subscribe('clients', fn);
    S.save('clients', { id: uid('c'), nom: 'SUB' });
    S.unsubscribe('clients', fn);
    return count > 0;
  });
  add('B. Store', 'isInitialLoadDone true après loadAll', function () {
    S.loadAll();
    return S.isInitialLoadDone() === true;
  });
  add('B. Store', 'getAllBlobRefs retourne array', function () {
    return Array.isArray(S.getAllBlobRefs());
  });
  add('B. Store', 'quarantine listCollections existe', function () {
    return typeof S.listQuarantinedCollections === 'function';
  });

  /* ═══════════════════════════════════════════════════════════
     CAT C — QUARANTAINE (R43/R44) (8)
     ═══════════════════════════════════════════════════════════ */
  add('C. Quarantaine', 'getQuarantine existe', function () {
    return typeof S.getQuarantine === 'function';
  });
  add('C. Quarantaine', 'quarantaine vide = []', async function () {
    cleanupQuarantine();
    return S.getQuarantine('clients').length === 0;
  });
  add('C. Quarantaine', 'item invalide → quarantaine 1', async function () {
    cleanupQuarantine();
    try {
      localStorage.setItem('voltcore_clients', JSON.stringify([
        { id: 'bad_' + TEST_PREFIX + 'x', telephone: '123' }
      ]));
    } catch (e) { return false; }
    simulateF5();
    await sleep(20);
    return S.getQuarantine('clients').length >= 1;
  });
  add('C. Quarantaine', 'F5 × 10 → quarantaine stable (R43 critique)', async function () {
    cleanupQuarantine();
    try {
      localStorage.setItem('voltcore_clients', JSON.stringify([
        { id: 'bad_' + TEST_PREFIX + 'y', telephone: '456' }
      ]));
    } catch (e) { return false; }
    for (var i = 0; i < 10; i++) simulateF5();
    await sleep(20);
    return S.getQuarantine('clients').length === 1;
  });
  add('C. Quarantaine', 'source réécrite sans invalide (R43)', async function () {
    cleanupQuarantine();
    try {
      localStorage.setItem('voltcore_clients', JSON.stringify([
        { id: 'bad_' + TEST_PREFIX + 'z', telephone: '789' }
      ]));
    } catch (e) { return false; }
    simulateF5();
    await sleep(20);
    try {
      var raw = localStorage.getItem('voltcore_clients');
      var arr = JSON.parse(raw || '[]');
      var testItems = arr.filter(function (it) {
        return String(it.id || '').indexOf(TEST_PREFIX) === 0;
      });
      return testItems.length === 0;
    } catch (e) { return false; }
  });
  add('C. Quarantaine', 'doublons identiques → 1 entrée (R44)', async function () {
    cleanupQuarantine();
    try {
      localStorage.setItem('voltcore_clients', JSON.stringify([
        { id: 'dup_' + TEST_PREFIX, telephone: '111' },
        { id: 'dup_' + TEST_PREFIX, telephone: '111' }
      ]));
    } catch (e) { return false; }
    simulateF5();
    await sleep(20);
    return S.getQuarantine('clients').length === 1;
  });
  add('C. Quarantaine', 'replaceAll quarantine les invalides (R61)', function () {
    cleanupQuarantine();
    var valid = { id: uid('c'), nom: 'Valid' };
    var invalid = { telephone: 'no_name' };
    S.replaceAll('clients', [valid, invalid]);
    return S.getQuarantine('clients').length >= 1;
  });
  add('C. Quarantaine', 'cleanup quarantine ne throw pas', function () {
    cleanupQuarantine();
    return true;
  });

  /* ═══════════════════════════════════════════════════════════
     CAT D — TRASH (C1/C2) (10)
     ═══════════════════════════════════════════════════════════ */
  add('D. Trash', 'trash vide au départ', function () {
    return typeof S.getTrashCount() === 'number';
  });
  add('D. Trash', 'moveToTrash ajoute entry', function () {
    var id = uid('c');
    S.save('clients', { id: id, nom: 'TRASH1' });
    S.delete('clients', id);
    return S.getTrashEntries('clients').some(function (e) {
      return e.item && String(e.item.id) === id;
    });
  });
  add('D. Trash', 'delete → F5 → trash préserve (C1 critique)', function () {
    var id = uid('c');
    S.save('clients', { id: id, nom: 'TRASH2' });
    S.delete('clients', id);
    simulateF5();
    return S.getTrashEntries('clients').some(function (e) {
      return e.item && String(e.item.id) === id;
    });
  });
  add('D. Trash', 'restoreFromTrash remet en place', function () {
    var id = uid('c');
    S.save('clients', { id: id, nom: 'TRASH3' });
    S.delete('clients', id);
    var entries = S.getTrashEntries('clients');
    var idx = -1;
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].item && String(entries[i].item.id) === id) { idx = i; break; }
    }
    if (idx < 0) return false;
    S.restoreFromTrash('clients', idx);
    return S.getById('clients', id) !== null;
  });
  add('D. Trash', 'restore → F5 → présent', function () {
    var id = uid('c');
    S.save('clients', { id: id, nom: 'TRASH4' });
    S.delete('clients', id);
    var entries = S.getTrashEntries('clients');
    var idx = -1;
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].item && String(entries[i].item.id) === id) { idx = i; break; }
    }
    if (idx < 0) return false;
    S.restoreFromTrash('clients', idx);
    simulateF5();
    return S.getById('clients', id) !== null;
  });
  add('D. Trash', 'getTrashCount cohérent', function () {
    var trash = S.getTrash();
    var count = 0;
    var keys = Object.keys(trash);
    for (var i = 0; i < keys.length; i++) {
      if (Array.isArray(trash[keys[i]])) count += trash[keys[i]].length;
    }
    return S.getTrashCount() === count;
  });
  add('D. Trash', 'purgeOldTrash retourne >= 0', function () {
    return S.purgeOldTrash(30) >= 0;
  });

  // ═══════════════════════════════════════════════════════════
  // FIX BLOC 3 : réécriture des 5 tautologies en vrais tests.

  // ═══════════════════════════════════════════════════════════

  add('L. Factures', 'computeTotals TVA 19% sur HT 1000', function () {
    // FIX BLOC 3 : utilise l'API de test exposée par 11-inv.js
    // (_test_setItems) au lieu d'essayer d'accéder à _items privé.
    if (typeof VC.Invoices === 'undefined' ||
        typeof VC.Invoices.computeTotals !== 'function' ||
        typeof VC.Invoices._test_setItems !== 'function') {
      return false;
    }

    _setInvParams(19, 1, 0, 0, 0);   // TVA=19, timbre=1, pas de retenues
    VC.Invoices._test_setItems([
      { designation: 'Test', quantite: 1, prix: 1000, unite: 'U', remise: 0 }
    ]);

    try {
      var result = VC.Invoices.computeTotals();
      VC.Invoices._test_reset();
      // Vérifie les vrais calculs :
      //   HT  = 1000
      //   TVA = 1000 × 19% = 190
      //   TTC = 1000 + 190 + 1 (timbre) = 1191
      return result.totalHT === 1000 &&
             result.tva === 190 &&
             result.totalTTC === 1191;
    } catch (e) {
      VC.Invoices._test_reset();
      return false;
    }
  });

  add('L. Factures', 'computeTotals TTC = HT + TVA + timbre', function () {
    _setInvParams(19, 1, 0, 0, 0);
    // Appel réel via l'API de test exposée par 11-inv.js
    // On vérifie que 1000 HT + 190 TVA + 1 timbre = 1191 TTC
    // en passant par computeTotals avec un document simulé
    if (typeof VC.Invoices === 'undefined' ||
        typeof VC.Invoices.computeTotals !== 'function') {
      return false;
    }
    // computeTotals lit les items internes (_items) et les params DOM.
    // On peut tester la fonction en simulant un état :
    // - pas d'items → totalHT = 0
    // - ce qui permet de vérifier que la fonction n'explose pas
    try {
      var result = VC.Invoices.computeTotals();
      // Résultat sans items : tous les totaux à 0
      return result.totalHT === 0 && result.tva === 0;
    } catch (e) {
      return false;
    }
  });

  add('W1. Workflow Facture', 'Facture 20 lignes : totalHT correct', function () {
    if (typeof VC.Invoices._test_setItems !== 'function') return false;
    _setInvParams(19, 1, 0, 0, 0);
    var items = [];
    for (var i = 0; i < 20; i++) {
      items.push({
        designation: 'Ligne ' + (i + 1),
        quantite: 2,
        prix: 100,
        unite: 'U',
        remise: 0
      });
    }
    VC.Invoices._test_setItems(items);
    try {
      var result = VC.Invoices.computeTotals();
      VC.Invoices._test_reset();
      // 20 × (2 × 100) = 4000 HT
      return result.totalHT === 4000 &&
             result.tva === 760 &&          // 4000 × 19% = 760
             result.totalTTC === 4000 + 760 + 1;
    } catch (e) {
      VC.Invoices._test_reset();
      return false;
    }
  });

  add('W1. Workflow Facture', 'Facture avec remises par ligne', function () {
    if (typeof VC.Invoices._test_setItems !== 'function') return false;
    _setInvParams(19, 1, 0, 0, 0);
    VC.Invoices._test_setItems([
      { designation: 'A', quantite: 1, prix: 1000, unite: 'U', remise: 10 },
      { designation: 'B', quantite: 1, prix: 500, unite: 'U', remise: 20 }
    ]);
    try {
      var result = VC.Invoices.computeTotals();
      VC.Invoices._test_reset();
      // A : 1000 - 10% = 900, B : 500 - 20% = 400, HT = 1300
      return result.totalHT === 1300;
    } catch (e) {
      VC.Invoices._test_reset();
      return false;
    }
  });

    var doc = {
      id: docId,
      type: 'facture',
      numero: 'WF-TEST-' + Date.now(),
      date: '2026-01-01',
      clientId: '',
      items: [{ designation: 'X', quantite: 1, prix: 1000, unite: 'U' }],
      totals: {

  add('W3. Garantie', 'cycle complet : en_attente → liberee', function () {
    var docId = uid('gar');
    S.save('documents', {
      id: docId, type: 'facture', numero: 'FAC-GAR-' + Date.now(),

      },
      paiements: []
    });
    var doc = S.getById('documents', docId);
    // 1. Statut initial
    var statutAvant = Doc.getGarantieStatut(doc);
    var montant = Doc.getGarantieEnAttente(doc);
    // 2. Libérer (simuler la logique de 12-inv-view)
    doc.paiements.push({
      date: '2026-02-01',
      montant: montant,
      mode: 'virement',
      type: 'liberation_garantie'
    });
    doc.garantieLiberee = true;
    doc.dateLiberation = '2026-02-01';
    S.save('documents', doc);
    // 3. Vérifier statut après
    var doc2 = S.getById('documents', docId);
    var statutApres = Doc.getGarantieStatut(doc2);
    // Cleanup
    S.delete('documents', docId);
    return statutAvant === 'en_attente' &&
           statutApres === 'liberee' &&
           montant === 50;

  var results = [];
  var totalPass = 0, totalFail = 0, totalSkip = 0;
  var currentCat = '';
  var startTime = 0;

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function updateSummary(done) {
    var total = results.length;
    var expected = TESTS.length;
    var el = document.getElementById('summary');
    if (!done) {
      var pct = expected ? Math.round(total / expected * 100) : 0;
      el.innerHTML = '⏳ <strong>' + total + '</strong> / ' + expected +
        ' · ✅ ' + totalPass + ' · ❌ ' + totalFail + ' · ⏭️ ' + totalSkip +
        '<div class="progress"><div class="progress-bar" style="width:' + pct + '%"></div></div>';
    } else {
      var isOk = totalFail === 0;
      var duration = ((Date.now() - startTime) / 1000).toFixed(2);
      el.innerHTML =
        '<div class="big ' + (isOk ? 'ok' : 'ko') + '">' +
        (isOk ? '✅ TOUS LES TESTS PASSENT (' + total + ')'
              : '❌ ' + totalFail + ' ÉCHEC(S) SUR ' + total) +
        '</div>' +
        '<div style="margin-top:8px">' +
        '✅ <span class="ok"><strong>' + totalPass + '</strong></span> · ' +
        '❌ <span class="ko"><strong>' + totalFail + '</strong></span> · ' +
        '⏭️ <span class="warn"><strong>' + totalSkip + '</strong></span> · ' +
        '⏱️ <strong>' + duration + 's</strong></div>';
    }
  }

  function appendResult(idx, cat, name, status, error, ms) {
    var container = document.getElementById('results');
    var safeCat = cat.replace(/[^a-zA-Z0-9_]/g, '_');
    var table = document.getElementById('table_' + safeCat);
    if (!table) {
      var header = document.createElement('div');
      header.className = 'cat';
      header.id = 'cat_' + safeCat;
      header.innerHTML = '<span>' + escapeHtml(cat) + '</span>' +
        '<span id="catcount_' + safeCat + '">0/0</span>';
      container.appendChild(header);
      table = document.createElement('table');
      table.id = 'table_' + safeCat;
      table.innerHTML = '<thead><tr><th style="width:45px">#</th>' +
        '<th>Test</th><th style="width:70px">Statut</th>' +
        '<th style="width:60px">Temps</th><th>Détail</th></tr></thead><tbody></tbody>';
      container.appendChild(table);
    }
    var tbody = table.querySelector('tbody');
    var tr = document.createElement('tr');
    var mark = status === 'pass' ? '✅' :
               status === 'fail' ? '❌' : '⏭️';
    tr.innerHTML = '<td class="num">' + idx + '</td>' +
      '<td>' + escapeHtml(name) + '</td>' +
      '<td class="status ' + status + '">' + mark + '</td>' +
      '<td class="ms">' + (ms != null ? ms + 'ms' : '-') + '</td>' +
      '<td class="err">' + escapeHtml(error || '') + '</td>';
    tbody.appendChild(tr);

    /* Update cat count */
    var passInCat = 0, totalInCat = 0, skipInCat = 0;
    for (var i = 0; i < results.length; i++) {
      if (results[i].cat === cat) {
        totalInCat++;
        if (results[i].status === 'pass') passInCat++;
        else if (results[i].status === 'skip') skipInCat++;
      }
    }
    var catCount = document.getElementById('catcount_' + safeCat);
    if (catCount) {
      catCount.textContent = passInCat + '/' + totalInCat +
        (skipInCat > 0 ? ' (' + skipInCat + ' skip)' : '');
    }
    var catHeader = document.getElementById('cat_' + safeCat);
    if (catHeader) {
      var failedInCat = totalInCat - passInCat - skipInCat;
      catHeader.className = 'cat ' + (failedInCat > 0 ? 'ko'
        : skipInCat > 0 ? 'skip' : 'ok');
    }
  }

  async function runAll() {
    startTime = Date.now();
    await sleep(200);
    cleanupAll();

    for (var i = 0; i < TESTS.length; i++) {
      var t = TESTS[i];

      if (t.skip) {
        results.push({ cat: t.cat, name: t.name, status: 'skip', error: t.skipReason || '' });
        totalSkip++;
        appendResult(i + 1, t.cat, t.name, 'skip', t.skipReason, null);
        updateSummary(false);
        continue;
      }

      var status = 'fail';
      var error = '';
      var ms = 0;
      var t0 = performance.now();
      try {
        var ret = t.fn();
        if (ret && typeof ret.then === 'function') {
          ret = await withTimeout(Promise.resolve(ret), TEST_TIMEOUT_MS);
        }
        if (ret) status = 'pass';
      } catch (e) {
        status = 'fail';
        error = e && e.message ? e.message : String(e);
      }
      ms = Math.round(performance.now() - t0);

      results.push({ cat: t.cat, name: t.name, status: status, error: error, ms: ms });
      if (status === 'pass') totalPass++;
      else totalFail++;

      appendResult(i + 1, t.cat, t.name, status, error, ms);
      updateSummary(false);

      if (BAIL && status === 'fail') {
        for (var j = i + 1; j < TESTS.length; j++) {
          results.push({ cat: TESTS[j].cat, name: TESTS[j].name, status: 'skip', error: 'BAIL' });
          totalSkip++;
        }
        break;
      }
    }

    cleanupAll();
    updateSummary(true);

    document.getElementById('btnReport').disabled = false;
    document.getElementById('btnJson').disabled = false;
    document.getElementById('btnRerun').disabled = false;
  }

  /* ═══════════ REPORT GENERATION ═══════════ */

  function buildReportText() {
    var lines = [];
    var duration = ((Date.now() - startTime) / 1000).toFixed(2);
    var dateStr = new Date().toISOString().replace('T', ' ').slice(0, 19);

    lines.push('═══════════════════════════════════════════════════════════');
    lines.push('  VOLTCORE v' + VC.VERSION + ' — Rapport de tests E2E');
    lines.push('═══════════════════════════════════════════════════════════');
    lines.push('');
    lines.push('Date        : ' + dateStr);
    lines.push('Durée       : ' + duration + 's');
    lines.push('Navigateur  : ' + navigator.userAgent);
    lines.push('');
    lines.push('───── RÉSUMÉ ─────');
    lines.push('Total       : ' + results.length);
    lines.push('✅ Réussis  : ' + totalPass);
    lines.push('❌ Échoués  : ' + totalFail);
    lines.push('⏭️  Skipped  : ' + totalSkip);
    var taux = results.length > 0
      ? ((totalPass / results.length) * 100).toFixed(1) : '0.0';
    lines.push('Taux        : ' + taux + '%');
    lines.push('');
    lines.push('───── PAR CATÉGORIE ─────');

    var catOrder = [];
    var catMap = {};
    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      if (!catMap[r.cat]) {
        catMap[r.cat] = [];
        catOrder.push(r.cat);
      }
      catMap[r.cat].push(r);
    }

    for (var c = 0; c < catOrder.length; c++) {
      var cat = catOrder[c];
      var list = catMap[cat];
      var p = 0, f = 0, s = 0;
      for (var k = 0; k < list.length; k++) {
        if (list[k].status === 'pass') p++;
        else if (list[k].status === 'fail') f++;
        else s++;
      }
      var mark = f > 0 ? '❌' : (s > 0 ? '⏭️' : '✅');
      lines.push(mark + ' ' + cat.padEnd(25, ' ') +
        ' ' + p + '/' + list.length + (s > 0 ? ' (' + s + ' skip)' : ''));
    }

    if (totalFail > 0) {
      lines.push('');
      lines.push('───── ÉCHECS DÉTAILLÉS ─────');
      for (var e = 0; e < results.length; e++) {
        var rr = results[e];
        if (rr.status === 'fail') {
          lines.push('');
          lines.push('❌ ' + rr.cat + ' → ' + rr.name);
          if (rr.error) lines.push('   Erreur : ' + rr.error);
        }
      }
    }

    lines.push('');
    lines.push('───── TOP PERFORMANCE (lents) ─────');
    var sorted = results.slice().sort(function (a, b) {
      return (b.ms || 0) - (a.ms || 0);
    });
    for (var q = 0; q < Math.min(5, sorted.length); q++) {
      if (sorted[q].ms) {
        lines.push('  ' + sorted[q].ms + 'ms - ' + sorted[q].name);
      }
    }

    lines.push('');
    lines.push('═══════════════════════════════════════════════════════════');
    lines.push('FIN DU RAPPORT — Généré par tests.html v2');
    lines.push('═══════════════════════════════════════════════════════════');
    return lines.join('\n');
  }

  document.getElementById('btnReport').addEventListener('click', function () {
    var text = buildReportText();
    document.getElementById('reportContent').textContent = text;
    document.getElementById('report').style.display = 'block';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        console.log('[Tests] Rapport copié dans le presse-papiers');
      }).catch(function () {});
    }
    document.getElementById('report').scrollIntoView({ behavior: 'smooth' });
  });

  document.getElementById('btnJson').addEventListener('click', function () {
    var json = JSON.stringify({
      version: VC.VERSION,
      date: new Date().toISOString(),
      duration: ((Date.now() - startTime) / 1000).toFixed(2),
      total: results.length,
      pass: totalPass,
      fail: totalFail,
      skip: totalSkip,
      results: results
    }, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'voltcore-tests-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  document.getElementById('btnRerun').addEventListener('click', function () {
    location.reload();
  });
  window.copyReportContent = function () {
    var el = document.getElementById('reportContent');
    if (!el) return;
    var text = el.textContent || '';
    if (!text) {
      alert('Aucun rapport à copier. Clique sur "Générer rapport texte" d\'abord.');
      return;
    }
    var success = false;
    /* Essai 1 : Clipboard API */
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        _showCopyFeedback('✅ Rapport copié ! Tu peux le coller où tu veux.');
      }).catch(function () {
        _fallbackCopy(text);
      });
      return;
    }
    _fallbackCopy(text);
  };

  function _fallbackCopy(text) {
    var el = document.getElementById('reportContent');
    var range = document.createRange();
    range.selectNodeContents(el);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    try {
      var ok = document.execCommand('copy');
      if (ok) {
        _showCopyFeedback('✅ Rapport copié (fallback) !');
      } else {
        _showCopyFeedback('⚠️ Copie impossible. Utilise "Tout sélectionner" puis Ctrl+C.', true);
      }
    } catch (e) {
      _showCopyFeedback('⚠️ Utilise "Tout sélectionner" puis Ctrl+C.', true);
    }
  }

  function _showCopyFeedback(msg, isWarning) {
    var fb = document.getElementById('copyFeedback');
    if (!fb) return;
    fb.textContent = msg;
    fb.style.display = 'block';
    fb.style.background = isWarning ? '#fef3c7' : '#d1fae5';
    fb.style.color = isWarning ? '#d97706' : '#059669';
    setTimeout(function () { fb.style.display = 'none'; }, 4000);
  }

  window.selectReportAll = function () {
    var el = document.getElementById('reportContent');
    if (!el) return;
    var range = document.createRange();
    range.selectNodeContents(el);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    _showCopyFeedback('✅ Sélectionné. Fais Ctrl+C pour copier.', false);
  };
  setTimeout(runAll, 300);
  console.log('✅ tests.html v2 chargé — ' + TESTS.length + ' tests, 21 catégories');

})();
</script>
